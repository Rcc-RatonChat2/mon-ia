<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon IA Microsoft/GitHub Gratuite</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border: 1px solid #30363d;
        }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        textarea {
            width: 90%;
            height: 100px;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: #0d1117;
            color: #f0f6fc;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: #58a6ff; }
        button {
            padding: 12px 24px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover { background-color: #2ea44f; }
        button:disabled { background-color: #21262d; cursor: not-allowed; color: #8b949e; }
        #reponse {
            margin-top: 25px;
            font-size: 16px;
            text-align: left;
            background-color: #0d1117;
            padding: 15px;
            border-radius: 6px;
            min-height: 40px;
            white-space: pre-wrap;
            border-left: 4px solid #58a6ff;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Posez votre vraie question</h1>
    <textarea id="question" placeholder="Posez une vraie question à l'IA..."></textarea>
    <br>
    <button id="btn" onclick="demanderIA()">Obtenir la réponse</button>

    <div id="reponse">La réponse de l'IA s'affichera ici...</div>
</div>

<script>
    // Utilisation de votre second jeton d'accès GitHub personnalisé (Fine-grained)
    const API_KEY = "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"; 

    async function demanderIA() {
        const question = document.getElementById('question').value.trim();
        const reponseDiv = document.getElementById('reponse');
        const bouton = document.getElementById('btn');

        if (!question) {
            reponseDiv.innerText = "Veuillez écrire une question.";
            return;
        }

        reponseDiv.innerText = "L'IA réfléchit...";
        bouton.disabled = true;

        try {
            // Utilisation de l'URL d'inférence Azure hébergée par Microsoft pour GitHub Models
            const response = await fetch("https://models.inference.ai.azure.com/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini", 
                    messages: [
                        { role: "system", content: "Répond en français de manière claire, concise et vraie." },
                        { role: "user", content: question }
                    ]
                })
            });

            if (response.status === 401 || response.status === 403) {
                reponseDiv.innerText = "Erreur d'authentification : Votre jeton n'est pas configuré correctement. Allez sur GitHub Models et cliquez sur 'Join Waitlist'.";
                return;
            }

            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                reponseDiv.innerText = data.choices[0].message.content;
            } else {
                reponseDiv.innerText = "Erreur de format de réponse de l'IA.";
            }

        } catch (error) {
            reponseDiv.innerText = "Erreur réseau : Le navigateur bloque la requête locale. Suivez l'étape ci-dessous pour publier le site gratuitement.";
            console.error(error);
        } finally {
            bouton.disabled = false;
        }
    }
</script>

</body>
</html>
